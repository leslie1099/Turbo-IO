name: relay-ipa
on:
  workflow_dispatch:
  push:
    branches: [sync-upstream-20260926]
permissions:
  contents: write
jobs:
  relay:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact (fast on runner network)
        run: |
          curl -L --fail -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -o ipa.zip "https://api.github.com/repos/leslie1099/Turbo-IO/actions/artifacts/10911096916/zip"
          ls -la ipa.zip
          sha256sum ipa.zip
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create tmu1-final-61ce3b5 --repo leslie1099/Turbo-IO --title "Turbo-IO 最终完整版 IPA (61ce3b5)" --notes "听书正序+文稿+歌单1000+播放模式+上次歌曲恢复+Cookie导入+闪退修复+30秒息屏+死锁恢复+中断自动恢复" --latest=false || true
          gh release upload tmu1-final-61ce3b5 ipa.zip --repo leslie1099/Turbo-IO --clobber
          echo "RELEASE_READY"
